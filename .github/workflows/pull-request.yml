name: Pull Request

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: node.js 18
        uses: actions/setup-node@v4.0.1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: "npm"

      - name: installing
        # sharp arrives transitively through gatsby and downloads a prebuilt libvips from GitHub
        # releases in its install script, so a network hiccup fails the whole install before any
        # step that matters runs. Nothing in this backend uses it. Retry rather than let a dropped
        # connection decide whether the suite gets to run at all.
        run: |
          for attempt in 1 2 3; do
            if npm install; then
              exit 0
            fi
            echo "npm install failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
          echo "npm install did not succeed after 3 attempts"
          exit 1

      - name: linters
        uses: wearerequired/lint-action@v1
        with:
          prettier: true
          prettier_extensions: ts,tsx,js,jsx,json,md,mdx,css
          continue_on_error: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: testing
        run: npm test -- --coverage

      - name: setup envs
        run: touch .env

      - name: build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: places
          tags: ${{ github.sha }}
          dockerfiles: |
            ./Dockerfile

      - name: coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # @master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: places_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: sqs
          DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566

    env:
      CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/places_test
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://localhost:4566
      QUEUE_URL: http://localhost:4566/000000000000/places_test
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - uses: actions/checkout@v2

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: node.js 18
        uses: actions/setup-node@v4.0.1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: "npm"

      - name: installing
        # sharp arrives transitively through gatsby and downloads a prebuilt libvips from GitHub
        # releases in its install script, so a network hiccup fails the whole install before any
        # step that matters runs. Nothing in this backend uses it. Retry rather than let a dropped
        # connection decide whether the suite gets to run at all.
        run: |
          for attempt in 1 2 3; do
            if npm install; then
              exit 0
            fi
            echo "npm install failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
          echo "npm install did not succeed after 3 attempts"
          exit 1

      - name: Create SQS queue in LocalStack
        run: |
          # Use the AWS CLI preinstalled on the runner instead of `pip install
          # awscli awscli-local`: pip resolves awscli against the runner's
          # system botocore, and the resulting version skew breaks awslocal.
          # The LocalStack service container has no health check, so retry
          # until the SQS endpoint answers.
          for attempt in $(seq 1 30); do
            if aws --endpoint-url "$AWS_ENDPOINT" sqs create-queue --queue-name places_test; then
              exit 0
            fi
            echo "LocalStack not ready (attempt $attempt/30), retrying in 2s..."
            sleep 2
          done
          echo "LocalStack did not become available in time"
          exit 1

      - name: Run database migrations
        run: >
          ./node_modules/.bin/node-pg-migrate
          --tsconfig ./tsconfig.json
          -j ts
          -m ./src/migrations
          -d CONNECTION_STRING
          up

      - name: Run integration tests
        run: npm run test:integration
